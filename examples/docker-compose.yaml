services:
  db:
    image: docker.io/mariadb:11
    container_name: examples-db-1
    volumes:
      - mariadb-koha:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: example
      MARIADB_DATABASE: koha_teolib
      MARIADB_USER: koha_teolib
      MARIADB_PASSWORD: example
    networks:
      - koha
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
    container_name: examples-elasticsearch-1
    command: >
      sh -c "bin/elasticsearch-plugin install --batch analysis-icu && 
             /usr/local/bin/docker-entrypoint.sh elasticsearch"
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    networks:
      - koha

  koha:
    image: teogramm/koha:24.11
    container_name: examples-koha-1
    ports:
      - 8080:8080
      - 8081:8081
    environment:
      MYSQL_SERVER: db
      MYSQL_USER: koha_teolib
      MYSQL_PASSWORD: example
      DB_NAME: koha_teolib
      MEMCACHED_SERVERS: memcached:11211
      MB_HOST: rabbitmq
      ELASTICSEARCH_SERVER: http://elasticsearch:9200
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    networks:
      - koha

  rabbitmq:
    image: docker.io/rabbitmq:3-management
    container_name: examples-rabbitmq-1
    command: >
      sh -c "rabbitmq-plugins enable --offline rabbitmq_stomp && rabbitmq-server"
    networks:
      - koha

  memcached:
    image: docker.io/memcached
    container_name: examples-memcached-1
    networks:
      - koha

volumes:
  mariadb-koha:

networks:
  koha:
