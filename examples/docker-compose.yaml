version: "3.9"

services:
  koha:
    image: teogramm/koha:24.11
    ports:
      - "8080:8080"
      - "8081:8081"
    cap_add:
      - DAC_READ_SEARCH
      - SYS_NICE
    environment:
      MYSQL_SERVER: db
      MYSQL_USER: koha_teolib
      MYSQL_PASSWORD: example
      DB_NAME: koha_teolib
      MEMCACHED_SERVERS: memcached:11211
      MB_HOST: rabbitmq
      ELASTICSEARCH_SERVER: http://elasticsearch:9200
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      memcached:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    networks:
      - koha

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
    command: >
      sh -c "bin/elasticsearch-plugin list | grep -q analysis-icu ||
      bin/elasticsearch-plugin install --batch analysis-icu;
      /usr/local/bin/docker-entrypoint.sh elasticsearch"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    networks:
      - koha

  rabbitmq:
    image: docker.io/rabbitmq:3
    volumes:
      - ./rabbitmq_plugins:/etc/rabbitmq/enabled_plugins
    networks:
      - koha

  db:
    image: docker.io/mariadb:11
    volumes:
      - mariadb-koha:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: example
      MARIADB_DATABASE: koha_teolib
      MARIADB_USER: koha_teolib
      MARIADB_PASSWORD: example
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - koha

  memcached:
    image: docker.io/memcached
    networks:
      - koha

volumes:
  mariadb-koha:
  elasticsearch-data:

networks:
  koha:
